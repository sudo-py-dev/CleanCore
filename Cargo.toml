[package]
name = "cleancore"
version = "0.2.8"
edition = "2021"
description = "Fast cross-platform system cleaner: registry (Windows) and config-store (Linux) scanner, backups, tuner"
license = "Apache-2.0"
repository = "https://github.com/sudo-py-dev/CleanCore"

[[bin]]
name = "cleancore"
path = "src/main.rs"

# Windows: packaged as cleancore.com, the terminal's way into cleancore.exe (src/launch.rs).
[[bin]]
name = "cleancore-console"
path = "src/bin/cleancore-console.rs"

# Opens cleancore: a stand-in for the window's own program until 0.2.8 (see the file).
[[bin]]
name = "cleancore-gui"
path = "src/bin/cleancore-gui.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:ksni", "dep:tray-icon", "dep:image", "dep:resvg", "dep:rfd", "dep:winit"]

[dependencies]
anyhow = "1"
# Duplicate finder: content hashes, several GB/s with SIMD
blake3 = "1.8.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
# glow (OpenGL) renderer: far smaller than the default wgpu one, and plenty for a 2D app
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "accesskit", "default_fonts", "wayland", "x11", "clipboard", "links"] }
egui_extras = { version = "0.37", optional = true }
# Program icons in the GUI: PNG/ICO/BMP and SVG (no text rendering needed)
image = { version = "0.25", optional = true, default-features = false, features = ["png", "ico", "bmp"] }
resvg = { version = "0.45", optional = true, default-features = false }
rayon = "1"
# Native folder and file pickers (the desktop portal on Linux, the shell dialog on Windows)
rfd = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
# Self-update: checking the signed checksum list of a release, and the downloads against it
minisign-verify = "0.2"
sha2 = "0.10"
# Right-to-left text: egui shapes each Hebrew word right to left but places words left to
# right, so text is handed to it already in display order (Unicode Bidirectional Algorithm).
unicode-bidi = "0.3"
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Console", "Win32_Globalization"] }
winreg = "0.55"
# Hunter Mode tray icon
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11.5"
# GNOME-style (Adwaita) window title bar on Wayland desktops that don't draw one themselves.
# eframe only turns it on through its default features, which also pull in the large wgpu renderer.
winit = { version = "0.30", optional = true, default-features = false, features = ["wayland", "wayland-csd-adwaita"] }
# Hunter Mode tray icon (StatusNotifierItem over D-Bus, pure Rust)
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
