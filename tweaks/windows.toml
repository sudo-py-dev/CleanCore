  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps', name = "DumpType", data = { dword = 2 } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps', name = "DumpCount", data = { dword = 10 } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps', name = "DumpFolder", data = { expand_sz = '%LOCALAPPDATA%\CrashDumps' } },
]

[[tweak]]
id = "win11_unsupported_upgrade"
name = "Allow Windows 11 upgrade on unsupported hardware"
category = "security"
description = "Lets the Windows 11 installer skip the TPM 2.0 and CPU checks."
min_build = 10240
warning = "Microsoft may not provide updates to unsupported devices."
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SYSTEM\Setup\MoSetup', name = "AllowUpgradesWithUnsupportedTPMOrCPU", data = { dword = 1 } }]

# ------------------------------------------------------------------ Usage

[[tweak]]
id = "photo_viewer"
name = "Enable Windows Photo Viewer"
category = "usage"
description = "Makes the classic Photo Viewer available in \"Open with\" for common image types."
min_build = 10240
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Photo Viewer\Capabilities\FileAssociations', name = ".jpg", data = { sz = "PhotoViewer.FileAssoc.Tiff" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Photo Viewer\Capabilities\FileAssociations', name = ".jpeg", data = { sz = "PhotoViewer.FileAssoc.Tiff" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Photo Viewer\Capabilities\FileAssociations', name = ".png", data = { sz = "PhotoViewer.FileAssoc.Tiff" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Photo Viewer\Capabilities\FileAssociations', name = ".bmp", data = { sz = "PhotoViewer.FileAssoc.Tiff" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Photo Viewer\Capabilities\FileAssociations', name = ".gif", data = { sz = "PhotoViewer.FileAssoc.Tiff" } },
]

[[tweak]]
id = "no_background_apps"
name = "Disable background apps"
category = "usage"
description = "Store apps can't run in the background, which saves power."
requires = "logoff"
min_build = 9600
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications', name = "GlobalUserDisabled", data = { dword = 1 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Search', name = "BackgroundAppGlobalToggle", data = { dword = 0 } },
]

[[tweak]]
id = "classic_user_accounts"
name = "Add classic User Accounts to Control Panel"
category = "usage"
description = "Adds an entry that opens the advanced user accounts dialog (netplwiz)."
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{6c3a8e52-0f4b-4d7e-9a1c-2b5d8f3e7a10}', name = "", data = { sz = "User Accounts (classic)" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{6c3a8e52-0f4b-4d7e-9a1c-2b5d8f3e7a10}', name = "System.ControlPanel.Category", data = { sz = "9" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{6c3a8e52-0f4b-4d7e-9a1c-2b5d8f3e7a10}\DefaultIcon', name = "", data = { expand_sz = '%SystemRoot%\System32\netplwiz.exe' } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{6c3a8e52-0f4b-4d7e-9a1c-2b5d8f3e7a10}\Shell\Open\command', name = "", data = { expand_sz = '%SystemRoot%\System32\netplwiz.exe' } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ControlPanel\NameSpace\{6c3a8e52-0f4b-4d7e-9a1c-2b5d8f3e7a10}', name = "", data = { sz = "User Accounts (classic)" } },
]

# ------------------------------------------------------------------ System

[[tweak]]
id = "classic_alt_tab"
name = "Use classic Alt+Tab"
category = "system"
description = "Small icons instead of large window previews."
requires = "explorer"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer', name = "AltTabSettings", data = { dword = 1 } }]

[[tweak]]
id = "no_driver_updates"
name = "Disable driver updates via Windows Update"
category = "system"
requires = "logoff"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name = "ExcludeWUDriversInQualityUpdate", data = { dword = 1 } }]

[[tweak]]
id = "no_store_autoupdate"
name = "Disable automatic Store app updates"
category = "system"
requires = "logoff"
min_build = 10240
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsStore', name = "AutoDownload", data = { dword = 2 } }]

[[tweak]]
id = "no_power_throttling"
name = "Disable power throttling"
category = "system"
description = "Background apps keep full CPU speed. Uses more battery."
requires = "reboot"
min_build = 16299
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling', name = "PowerThrottlingOff", data = { dword = 1 } }]

[[tweak]]
id = "no_telemetry"
name = "Minimize telemetry and data collection"
category = "system"
description = "Sets diagnostic data to the lowest level the edition allows."
requires = "logoff"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowTelemetry", data = { dword = 0 } }]

[[tweak]]
id = "edge_no_background"
name = "Stop Microsoft Edge running in the background"
category = "system"
requires = "logoff"
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge', name = "StartupBoostEnabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge', name = "BackgroundModeEnabled", data = { dword = 0 } },
]

[[tweak]]
id = "clear_pagefile"
name = "Clear the page file at shutdown"
category = "system"
description = "Wipes virtual memory on shutdown for privacy. Shutdown takes longer."
requires = "reboot"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', name = "ClearPageFileAtShutdown", data = { dword = 1 } }]

