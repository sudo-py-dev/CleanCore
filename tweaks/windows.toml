# ------------------------------------------------------------------ Security and Stability

[[tweak]]
id = "disable_autoplay"
name = "Disable AutoPlay on all drives"
category = "security"
description = "Reduces the risk of malware starting from USB drives and discs."
requires = "logoff"
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoDriveTypeAutoRun", data = { dword = 255 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers', name = "DisableAutoplay", data = { dword = 1 } },
]

[[tweak]]
id = "close_hung_apps"
name = "Close unresponsive apps automatically"
category = "security"
description = "Ends hung apps faster and skips the \"This app is preventing shutdown\" screen."
requires = "logoff"
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_CURRENT_USER\Control Panel\Desktop', name = "AutoEndTasks", data = { sz = "1" } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Control Panel\Desktop', name = "HungAppTimeout", data = { sz = "2000" } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Control Panel\Desktop', name = "WaitToKillAppTimeout", data = { sz = "2000" } },
]

[[tweak]]
id = "never_auto_end_tasks"
name = "Never end apps automatically at shutdown"
category = "security"
description = "Windows waits for you instead of closing apps with unsaved work."
requires = "logoff"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Control Panel\Desktop', name = "AutoEndTasks", data = { sz = "0" } }]

[[tweak]]
id = "no_download_block"
name = "Disable the security warning on downloaded files"
category = "security"
description = "Downloaded files are no longer marked as coming from the internet."
requires = "logoff"
warning = "Downloaded files will open without the \"unknown publisher\" warning."
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments', name = "SaveZoneInformation", data = { dword = 1 } }]

[[tweak]]
id = "take_ownership"
name = "Add \"Take Ownership\" to the context menu"
category = "security"
description = "Right-click a file or folder to give Administrators full access to it."
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\runas', name = "", data = { sz = "Take Ownership" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\runas', name = "HasLUAShield", data = { sz = "" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\runas', name = "NoWorkingDirectory", data = { sz = "" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\runas\command', name = "", data = { sz = 'cmd.exe /c takeown /f "%1" && icacls "%1" /grant administrators:F' } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\*\shell\runas\command', name = "IsolatedCommand", data = { sz = 'cmd.exe /c takeown /f "%1" && icacls "%1" /grant administrators:F' } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\runas', name = "", data = { sz = "Take Ownership" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\runas', name = "HasLUAShield", data = { sz = "" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\runas', name = "NoWorkingDirectory", data = { sz = "" } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\runas\command', name = "", data = { sz = 'cmd.exe /c takeown /f "%1" /r /d y && icacls "%1" /grant administrators:F /t' } },
  { type = "reg", key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\runas\command', name = "IsolatedCommand", data = { sz = 'cmd.exe /c takeown /f "%1" /r /d y && icacls "%1" /grant administrators:F /t' } },
]

[[tweak]]
id = "disable_smartscreen"
name = "Disable SmartScreen"
category = "security"
description = "Turns off SmartScreen checks for apps and files."
requires = "logoff"
min_build = 22000
warning = "SmartScreen blocks known malicious downloads. Only disable it if you have other protection."
