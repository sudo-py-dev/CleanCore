# CleanCore Registry Tuner: Windows tweaks.
#
# Each [[tweak]] has one [[tweak.option]] (a toggle, id "on") or several (a choice).
# Settings:
#   { type = "reg",        key = 'HKEY_...\Path', name = "Value", data = { dword = 1 } }
#   { type = "reg_delete", key = 'HKEY_...\Path', name = "Value" }
# data kinds: dword, qword, sz, expand_sz, multi_sz, binary.  name = "" is the (Default) value.
# Reverting restores whatever was there before, so no "off" data is needed.
# Builds: Windows 7 = 7600, 8.1 = 9600, 10 = 10240, 11 = 22000.

# ------------------------------------------------------------------ Appearance

[[tweak]]
id = "taskbar_thumbnails_fast"
name = "Show taskbar thumbnails faster"
category = "appearance"
description = "Hovering over a taskbar button shows window thumbnails with almost no delay."
requires = "explorer"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "ExtendedUIHoverTime", data = { dword = 1 } }]

[[tweak]]
id = "peek_fast"
name = "Show Peek at desktop faster"
category = "appearance"
description = "Shorter delay before the desktop preview appears when hovering the corner of the taskbar."
requires = "explorer"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "DesktopLivePreviewHoverTime", data = { dword = 100 } }]

[[tweak]]
id = "menus_fast"
name = "Speed up Windows menus"
category = "appearance"
description = "Minimizes the delay before a submenu opens (default 400 ms)."
requires = "logoff"
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Control Panel\Desktop', name = "MenuShowDelay", data = { sz = "50" } }]

[[tweak]]
id = "classic_context_menu"
name = "Use the Windows 10 context menu"
category = "appearance"
description = "Opens the full classic right-click menu directly instead of the Windows 11 compact menu."
requires = "explorer"
min_build = 22000
[[tweak.option]]
id = "on"
set = [{ type = "reg", key = 'HKEY_CURRENT_USER\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32', name = "", data = { sz = "" } }]

[[tweak]]
id = "disable_ads"
name = "Disable ads and suggested apps"
category = "appearance"
description = "Stops Start suggestions, silently installed promoted apps, tips and sync-provider ads in File Explorer."
requires = "logoff"
min_build = 10240
[[tweak.option]]
id = "on"
set = [
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SilentInstalledAppsEnabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SystemPaneSuggestionsEnabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SoftLandingEnabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SubscribedContent-338388Enabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SubscribedContent-338389Enabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name = "SubscribedContent-310093Enabled", data = { dword = 0 } },
  { type = "reg", key = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "ShowSyncProviderNotifications", data = { dword = 0 } },
]

[[tweak]]
id = "no_logon_blur"
