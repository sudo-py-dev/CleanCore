# CleanCore Tuner: Linux tweaks (GNOME-family desktops, via gsettings).
#
#   { type = "gsettings", schema = "org.gnome...", key = "name", value = "<GVariant text>" }
# `value` must be written exactly as `gsettings get` prints it (strings quoted: "'list-view'",
# integers typed: "uint32 30") so CleanCore can tell whether the tweak is active.
# A tweak is shown as unavailable when its schema or key isn't installed.

# ------------------------------------------------------------------ Appearance

[[tweak]]
id = "color_scheme"
name = "Color scheme"
category = "appearance"
description = "Light or dark style for apps that follow the system preference."
[[tweak.option]]
id = "dark"
label = "Prefer dark"
set = [{ type = "gsettings", schema = "org.gnome.desktop.interface", key = "color-scheme", value = "'prefer-dark'" }]
[[tweak.option]]
id = "light"
label = "Prefer light"
set = [{ type = "gsettings", schema = "org.gnome.desktop.interface", key = "color-scheme", value = "'prefer-light'" }]

[[tweak]]
id = "no_animations"
name = "Disable animations"
category = "appearance"
description = "Windows, menus and the overview open instantly."
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.interface", key = "enable-animations", value = "false" }]

[[tweak]]
id = "battery_percentage"
name = "Show battery percentage"
category = "appearance"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.interface", key = "show-battery-percentage", value = "true" }]

[[tweak]]
id = "titlebar_buttons"
name = "Title bar buttons"
category = "appearance"
description = "Which window buttons are shown and on which side."
[[tweak.option]]
id = "right"
label = "Minimize, maximize, close on the right"
set = [{ type = "gsettings", schema = "org.gnome.desktop.wm.preferences", key = "button-layout", value = "'appmenu:minimize,maximize,close'" }]
[[tweak.option]]
id = "left"
label = "Close, minimize, maximize on the left"
set = [{ type = "gsettings", schema = "org.gnome.desktop.wm.preferences", key = "button-layout", value = "'close,minimize,maximize:appmenu'" }]

# ------------------------------------------------------------------ Files

[[tweak]]
id = "files_list_view"
name = "Open folders in list view"
category = "file_explorer"
description = "The Files app shows details (size, type, date) by default."
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "default-folder-viewer", value = "'list-view'" }]

[[tweak]]
id = "files_delete_permanently"
name = "Add \"Delete Permanently\" to the Files menu"
category = "file_explorer"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "show-delete-permanently", value = "true" }]

[[tweak]]
id = "files_create_link"
name = "Add \"Create Link\" to the Files menu"
category = "file_explorer"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "show-create-link", value = "true" }]

[[tweak]]
id = "files_single_click"
name = "Open items with a single click"
category = "file_explorer"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "click-policy", value = "'single'" }]

[[tweak]]
id = "files_recursive_search"
name = "Search inside subfolders"
category = "file_explorer"
description = "Where the Files app searches subfolders."
[[tweak.option]]
id = "always"
label = "Everywhere, including network locations"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "recursive-search", value = "'always'" }]
[[tweak.option]]
id = "never"
label = "Never (faster)"
set = [{ type = "gsettings", schema = "org.gnome.nautilus.preferences", key = "recursive-search", value = "'never'" }]

[[tweak]]
id = "dialog_show_hidden"
name = "Show hidden files in file dialogs"
category = "file_explorer"
[[tweak.option]]
id = "on"
set = [
  { type = "gsettings", schema = "org.gtk.gtk4.Settings.FileChooser", key = "show-hidden", value = "true" },
  { type = "gsettings", schema = "org.gtk.Settings.FileChooser", key = "show-hidden", value = "true" },
]

