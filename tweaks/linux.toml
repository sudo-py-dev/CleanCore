# ------------------------------------------------------------------ Security and privacy

[[tweak]]
id = "no_autorun"
name = "Never autorun software on inserted media"
category = "security"
description = "Reduces the risk of malware starting from USB drives and discs."
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.media-handling", key = "autorun-never", value = "true" }]

[[tweak]]
id = "no_lockscreen_notifications"
name = "Hide notifications on the lock screen"
category = "security"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.notifications", key = "show-in-lock-screen", value = "false" }]

[[tweak]]
id = "no_recent_files"
name = "Don't remember recently used files"
category = "security"
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.privacy", key = "remember-recent-files", value = "false" }]

[[tweak]]
id = "auto_empty_trash"
name = "Empty trash and temp files older than 30 days"
category = "security"
[[tweak.option]]
id = "on"
set = [
  { type = "gsettings", schema = "org.gnome.desktop.privacy", key = "remove-old-trash-files", value = "true" },
  { type = "gsettings", schema = "org.gnome.desktop.privacy", key = "remove-old-temp-files", value = "true" },
  { type = "gsettings", schema = "org.gnome.desktop.privacy", key = "old-files-age", value = "uint32 30" },
]

[[tweak]]
id = "no_problem_reports"
name = "Don't send problem reports or usage statistics"
category = "security"
[[tweak.option]]
id = "on"
set = [
  { type = "gsettings", schema = "org.gnome.desktop.privacy", key = "report-technical-problems", value = "false" },
  { type = "gsettings", schema = "org.gnome.desktop.privacy", key = "send-software-usage-stats", value = "false" },
]

[[tweak]]
id = "disable_camera"
name = "Block camera access"
category = "security"
description = "Apps using the GNOME camera portal can't use the camera."
[[tweak.option]]
id = "on"
set = [{ type = "gsettings", schema = "org.gnome.desktop.privacy", key = "disable-camera", value = "true" }]

